# /apps/blog.silarhi.fr/docker-compose.yml
services:

  database:
    image: postgres:16
    container_name: ${NAME}_pg
    restart: unless-stopped
    environment:
      #MARIADB_RANDOM_ROOT_PASSWORD: 'yes'
      POSTGRES_DATABASE: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    networks:
      - lan
    volumes:
      - ./postgres-data:/var/lib/postgresql/data

  postgresql:
    image: adminer
    container_name: ${NAME}_pma
    restart: unless-stopped
    environment:
      PMA_ABSOLUTE_URI: https://${NAME}.jrcan.dev/adminer
        #PMA_HOST: ${NAME}_db
      UPLOAD_LIMIT: 128M
    labels:
      - traefik.enable=true
      - traefik.http.routers.pma_${NAME}.entrypoints=websecure
      - traefik.http.routers.pma_${NAME}.rule=Host(`${NAME}.jrcan.dev`) && PathPrefix(`/adminer/`)
      - traefik.http.middlewares.pmapathstrip_${NAME}.stripprefix.prefixes=/adminer
      - traefik.http.routers.pma_${NAME}.middlewares=pmapathstrip_${NAME}@docker
      - traefik.http.routers.pma_${NAME}.tls=true
      - traefik.http.routers.pma_${NAME}.tls.certresolver=myresolver
    volumes:
        - /sessions
    networks:
        - web
        - lan
  app:
    container_name: ${NAME}
    build: 
      context: .
      dockerfile: Dockerfile
    networks:
        - lan
        - web
    labels:
      - traefik.enable=true
      - traefik.http.routers.${NAME}.entryPoints=websecure
      - "traefik.http.services.${NAME}.loadbalancer.server.port=3000"
      - traefik.http.routers.${NAME}.rule=Host(`${NAME}.jrcan.dev`)
      - traefik.http.routers.${NAME}.tls=true
      - traefik.http.routers.${NAME}.tls.certresolver=myresolver

    restart: always
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}"

networks:
  web:
    external: true
  lan:
    external: false
    name: lan_${NAME}

